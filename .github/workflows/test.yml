name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: market_reader, POSTGRES_PASSWORD: test, POSTGRES_DB: market_reader }
        ports: ['5432:5432']
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: market_reader
      DB_USER: market_reader
      DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ ninja-build \
            libcurl4-openssl-dev libssl-dev zlib1g-dev \
            libfmt-dev libspdlog-dev libyaml-cpp-dev \
            nlohmann-json3-dev libgtest-dev
      - name: Build candidate-replay-eval
        run: |
          cmake -B build -G Ninja -DMR_BUILD_TESTS=ON
          cmake --build build --target candidate-replay-eval -j
          echo "CANDIDATE_REPLAY_EVAL_BIN=$PWD/build/apps/market-core/candidate-replay-eval" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npm test --workspace=@vs-v2/control-api
      - name: Windows startup flow (PAPER fail-closed, no LIVE)
        run: npm run test:windows-startup
      - run: python3 -m pip install --user -r requirements/requirements-dev.txt
      - run: PYTHONPATH=. python3 -m pytest ai/tests -q
