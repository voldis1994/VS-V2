<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#050508" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark" />
    <title>VS Client</title>
    <!-- No Google Fonts CDN — Safari content blockers / cellular often block fonts.googleapis.com -->
    <link rel="icon" type="image/png" href="/logo-full.png" />
    <link rel="apple-touch-icon" href="/logo-full.png" />
    <style>
      /* Instant paint before CSS bundle — avoid white letterbox flash on iPhone */
      html {
        height: 100%;
        height: -webkit-fill-available;
      }
      html, body, #root {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        background: #050508;
        overflow: hidden;
      }
      body {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.client.tsx"></script>
  </body>
</html>
